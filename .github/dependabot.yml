# The runtime versions (Go, TinyGo, Python, Node.js) live in the Makefile and
# reach the Dockerfiles as build args, which Dependabot cannot follow: those
# are updated by hand. core/ has no Go dependencies, and packages/python only
# declares lower bounds, which a library should not raise without a reason.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /examples/nextjs
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
